# Foundation application configuration
app-name = "prime-graffito"
friendly-app-name = "Graffito"
launcher-app-name = "Graffito"
description = "Personal notes on the bitcoin blockchain: compose on-device, sign offline, sync via bundles"
icon = "resources/icon.svg"
theme = "resources/theme.json"
signing-identity = "byteapps"
app-id = "0x80939851304fbf1880340f62cd9f9aac"
version = "0.1.0"
min-keyos-version = "1.0.0"

[publisher]
name = "ByteApps LLC"
contact-email = "salvador@byteapps.com"
support-url = "https://byteapps.com"

[permissions]
template = ["gui-app", "fs-generic", "fs-access"]
# No explicit os/fs grants: MountAirlock/FormatAirlock/FlushFs are
# Foundation-only under SDK 1.0.0 (a third-party app is never granted them,
# and the republished SDK fails the build on declaring them). Airlock is
# reached through the fs-generic/fs-access templates only — the SYSTEM
# mounts it when USB attaches (see ensure_airlock_mounted in main.rs).
# GetAppSeed (HMAC-derived per-app seed, PIN-gated on hardware) is the sole
# root of the notes identity key AND the note encryption key — the wipe
# recovery story depends on it. NOT GetSeed: this app must never see the
# wallet's actual seed entropy.
"os/security" = ["GetAppSeed"]
