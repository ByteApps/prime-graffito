# Workspace root: the KeyOS app binary. notes-core (protocol) and
# graffito-core (shared policy) moved to ByteApps/graffito on 2026-09-02
# when this app was shelved; they come in as git dependencies below.
# (wallet-core/pgp-core/bip85-core pattern — see ../CLAUDE.md).
[package]
name = "prime-graffito"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["."]

# KeyOS's own getrandom override (vendored in vendor/getrandom): on
# --cfg keyos (hardware) builds it sources entropy from the os TRNG server;
# on host/simulator builds it behaves like stock getrandom 0.2. Note ids,
# AEAD nonces and BIP340 aux randomness all come through this path.
[patch.crates-io]
getrandom = { path = "vendor/getrandom" }

# Debug builds (what `foundation sim` produces) would make EC math and
# hashing sluggish; optimize just those crates.
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[dependencies]
# BOTH graffito git deps MUST pin the SAME rev: two revs of one repo would
# give cargo two notes-core sources and `pq::MlKemAlg` type clashes. The
# rev is the graffito commit that absorbed the crates (byte-identical to
# this repo's last in-tree copies, 7a08a94), so tx construction is unchanged.
# https, not ssh: both repos are public, so a clone builds without any
# GitHub credentials.
notes-core = { git = "https://github.com/ByteApps/graffito.git", rev = "44a0d5914b4aae5a69ef61e57887a0664a6ff4b7" }
# Shared policy (compose Security copy — graffito-core/src/seclabel.rs),
# rendered identically by the graffito Mac/mobile app.
graffito-core = { git = "https://github.com/ByteApps/graffito.git", rev = "44a0d5914b4aae5a69ef61e57887a0664a6ff4b7" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# post-quantum passphrase generator (src/passphrase.rs): entropy draws go
# straight through getrandom 0.2, covered by the [patch.crates-io] TRNG
# override above — same version pin as notes-core's own dependency.
getrandom = "0.2"
# KeyOS security API (vendored — see vendor/security-api/Cargo.toml header):
# provides GetAppSeed for the notes identity + encryption keys.
security = { path = "vendor/security-api" }
log = "0.4"
log-server = { package = "xous-api-log", path = "../keyos-sdk/lib/keyos/xous/api/log" }
server = { path = "../keyos-sdk/lib/keyos/server" }
slint-keyos-platform = { path = "../keyos-sdk/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = "../keyos-sdk/lib/keyos/sdk/crates/foundation-themes" }

[build-dependencies]
foundation-themes = { path = "../keyos-sdk/lib/keyos/sdk/crates/foundation-themes" }
slint-keyos-platform-build = { path = "../keyos-sdk/lib/keyos/slint-keyos-platform/build" }
